# Airline cabin-bag limits used by checks/luggage_fit.py. Loaded automatically for any brief
# with vertical_checks: [luggage_fit]. Re-verified on every run (captures expire after 7 days).
official_sources:
- url: https://www.easyjet.com/en/help/baggage/cabin-bag-and-hold-luggage
  label: easyJet cabin bags
  facts:
  - id: easyjet.under_seat
    claim: easyJet free small under-seat cabin bag, maximum size
    value: 45 x 36 x 20 cm
    condition: including handles and wheels
    kind: bag_limit
    carrier: easyJet
    allowance: free under-seat bag
- url: https://www.britishairways.com/content/information/baggage-essentials
  label: British Airways baggage essentials
  facts:
  - id: ba.cabin
    claim: British Airways cabin bag, maximum size
    value: 56 x 45 x 25cm
    also:
    - including wheels and handles
    condition: including wheels and handles
    kind: bag_limit
    carrier: British Airways
    allowance: cabin bag
  - id: ba.personal
    claim: British Airways handbag or backpack (personal item), maximum size
    value: 40 x 30 x 15cm
    also:
    - Must easily fit under the seat in front of you
    kind: bag_limit
    carrier: British Airways
    allowance: handbag or backpack
- url: https://help.ryanair.com/hc/en-gb/articles/12888036565521-Ryanair-s-Bag-Policy
  label: Ryanair bag policy
  facts:
  - id: ryanair.small
    claim: Ryanair free small personal bag, maximum size
    value: 40 x 30 x 20 cm
    also:
    - must fit under the seat in front of you
    kind: bag_limit
    carrier: Ryanair
    allowance: free small personal bag
  - id: ryanair.priority
    claim: Ryanair Priority & 2 Cabin Bags, 10kg overhead-locker bag, maximum size
    value: 55x40x20cm
    also:
    - Priority & 2 Cabin Bags
    - 10kg bag
    kind: bag_limit
    carrier: Ryanair
    allowance: Priority 10kg cabin bag
- url: https://www.wizzair.com/en-gb/help-centre/booking-information-and-services/baggage/baggage-allowance/cabin-baggage
  label: Wizz Air cabin baggage
  facts:
