name: info_gain
kind: script
description: Information gain beyond the top 10. Searches forums, review sites and independent blogs for the keyword (Serper), reads what it can, and keeps excerpts with their source so the writer can add attributed real-world experience and opinion. Deep mode only.
needs: [serp_intel, reddit_voice]
modes: [manual]  # off: the seo-gain-researcher agents find experience and evidence beyond page one with the tool's own web search (no Serper credit); Reddit skipped by the operator
budget_s: 10
outputs: [research/info_gain.json]
